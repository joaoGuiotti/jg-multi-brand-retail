<div class="min-h-screen bg-surface flex items-center justify-center p-4">
  <div class="max-w-md w-full">
    <!-- Logo/Brand -->
    <div class="text-center mb-8">
      <h1 class="text-4xl font-bold text-content mb-2">Retail POS</h1>
      <p class="text-content-secondary">Sign in to your account</p>
    </div>

    <!-- Login Card -->
    <ui-card padding="lg" [shadow]="true">
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <!-- Email Field -->
        <ui-input-field class="mb-6" [required]="false" label="Email" type="email" formControlName="email"
          [class.border-error]="email?.invalid && email?.touched" placeholder="you@example.com"
          [error]="email?.invalid && email?.touched ? 'Email is required' : null"
          [hint]="email?.invalid && email?.touched ? 'Please enter a valid email' : null">
        </ui-input-field>

        <!-- Password Field -->
        <ui-input-field class="mb-6" [required]="false" label="Password" type="password" formControlName="password"
          [class.border-error]="password?.invalid && password?.touched" placeholder="••••••••"
          [error]="password?.invalid && password?.touched ? 'Password is required' : null"
          [hint]="password?.invalid && password?.touched ? 'Please enter a valid password' : null">
        </ui-input-field>

        <!-- Error Message -->
        @if (errorMessage) {
        <div class="mb-4 p-3 bg-error-bg border border-error rounded-lg">
          <p class="text-sm text-error">{{ errorMessage }}</p>
        </div>
        }

        <!-- Success Message -->
        @if (successMessage) {
        <div class="mb-4 p-3 bg-success/10 border border-success rounded-lg">
          <p class="text-sm text-success">{{ successMessage }}</p>
        </div>
        }

        <div class="flex justify-end mb-6">
          <a routerLink="/forgot-password" class="text-sm text-primary hover:text-primary-hover font-medium">Forgot
            password?</a>
        </div>

        <!-- Submit Button -->
        <ui-button type="submit" variant="primary" [fullWidth]="true" [loading]="isLoading"
          [disabled]="loginForm.invalid || isLoading">
          Sign In
        </ui-button>
      </form>

      <!-- Register Link -->
      <div class="mt-6 text-center">
        <p class="text-sm text-content-secondary">
          Don't have an account?
          <a routerLink="/register" class="text-primary hover:text-primary-hover font-medium">Sign up</a>
        </p>
      </div>
    </ui-card>

    <!-- Demo Credentials -->
    @if(isDevMode) {
    <div class="mt-4 p-4 bg-info-bg rounded-lg border border-info">
      <p class="text-sm text-info font-medium mb-2">Demo Credentials:</p>

      <div class="flex items-center gap-2 mb-1">
        <p class="text-xs text-info">Email: admin&#64;lojademo.com</p>
        <button type="button" title="Copy email" (click)="copyToClipboard('email', 'admin@lojademo.com')"
          class="copy-btn">
          @if (copiedField === 'email') {
          <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12" />
          </svg>
          } @else {
          <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2" />
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" />
          </svg>
          }
        </button>
      </div>

      <div class="flex items-center gap-2">
        <p class="text-xs text-info">Password: *********</p>
        <button type="button" title="Copy password" (click)="copyToClipboard('password', 'loja123')" class="copy-btn">
          @if (copiedField === 'password') {
          <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12" />
          </svg>
          } @else {
          <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2" />
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" />
          </svg>
          }
        </button>

      </div>
      <ui-button class="mt-4" variant="secondary" [outline]="true" (click)="autoLogin()" [fullWidth]="true">
        Auto Login(Dev Only)
      </ui-button>
    </div>
    }
  </div>
</div>
