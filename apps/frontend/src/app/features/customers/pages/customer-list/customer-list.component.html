<div class="mx-auto">
    <ui-page-header title="Clientes" subtitle="Gerencie a base de clientes da loja.">
        <ng-template #actions>
            <ui-button variant="primary" icon="M12 4v16m8-8H4" [routerLink]="['/customers/new']">
                Novo Cliente
            </ui-button>
        </ng-template>
    </ui-page-header>

    <div class="flex flex-col gap-4">
        <!-- Filters -->
        <ui-card padding="sm" [shadow]="true" class="mb-6 block">
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4 items-end">
                <div class="md:col-span-2">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Search</label>
                    <ui-input-field type="text" [(ngModel)]="searchTerm" (keyup.enter)="onSearch()"
                        placeholder="Search by name, email or document..." />
                </div>

                <div class="flex items-center gap-4 py-2">
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="checkbox" [(ngModel)]="showActiveOnly" (change)="onFilterChange()"
                            class="rounded border-gray-300 text-primary focus:ring-primary">
                        <span class="text-sm text-gray-700">Show only active</span>
                    </label>
                </div>
            </div>
        </ui-card>

        <!-- Error Message -->
        @if (errorMessage()) {
        <div class="bg-red-50 border-l-4 border-red-400 p-4 mb-4">
            <div class="flex">
                <div class="flex-shrink-0">
                    <svg class="h-5 w-5 text-red-400" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd"
                            d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z"
                            clip-rule="evenodd" />
                    </svg>
                </div>
                <div class="ml-3">
                    <p class="text-sm text-red-700">{{ errorMessage() }}</p>
                </div>
            </div>
        </div>
        }

        <!-- Table -->
        <div class="min-h-[400px]">
            <ui-table [columns]="columns()" [dataSource]="customers()" [config]="tableConfig()"
                (pageChange)="onPageChange($event)" (sortChange)="onSortChange($event)">
                <div *uiTableColumn="'isActive'; let customer">
                    <ui-badge [variant]="customer.isActive ? 'success' : 'error'">
                        {{ customer.isActive ? 'Active' : 'Inactive' }}
                    </ui-badge>
                </div>

                <div *uiTableColumn="'document'; let customer">
                    {{ customer.document | uiDocument }}
                </div>

                <div *uiTableColumn="'phone'; let customer">
                    {{ customer.phone | uiPhone }}
                </div>

                <div *uiTableColumn="'actions'; let customer">
                    <div class="flex gap-2 justify-end">
                        <ui-button variant="ghost" size="sm" (clicked)="editCustomer(customer.id)">
                            Edit
                        </ui-button>
                        <ui-button [uiHasRole]="'ADMIN'" variant="danger" size="sm" (clicked)="deleteCustomer(customer.id)">
                            Delete
                        </ui-button>
                    </div>
                </div>
            </ui-table>
        </div>
    </div>
</div>
