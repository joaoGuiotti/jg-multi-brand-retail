<div class="mx-auto">

    <!-- Header -->
    <div class="flex items-center justify-between mb-6">
        <h1 class="text-3xl font-bold text-content">Dashboard</h1>
        <div class="text-sm text-content-secondary">
            {{ isLoading() ? 'Loading...' : 'Updated now' }}
        </div>
    </div>

    <!-- Quick Actions (Moved to TOP) -->
    <app-quick-actions
        (action)="navigateTo($event === 'pos' ? '/pos' : $event === 'products' ? '/products/new' : $event === 'inventory' ? '/inventory' : '/sales')">
    </app-quick-actions>

    <!-- KPI Cards -->
    <app-kpi-cards [revenueToday]="revenueToday()" [salesToday]="salesToday()" [totalProducts]="totalProducts()"
        [lowStock]="lowStock()" [outOfStock]="outOfStock()">
    </app-kpi-cards>

    <!-- Revenue Chart -->
    <app-revenue-chart [chartOptions]="chartOptions()">
    </app-revenue-chart>

    <!-- Main Content Grid -->
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-6">
        <!-- Recent Sales -->
        <app-recent-sales [recentSales]="recentSales()" (viewAll)="navigateTo('/sales')">
        </app-recent-sales>

        <!-- Recent Inventory Movements -->
        <app-inventory-movements [recentMovements]="recentMovements()" (viewAll)="navigateTo('/inventory')">
        </app-inventory-movements>
    </div>

</div>
