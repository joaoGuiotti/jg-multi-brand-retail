<div class="mx-auto">

    <!-- Header -->
    <div class="flex items-center justify-between mb-6">
        <h1 class="text-3xl font-bold text-content">Dashboard</h1>
        <div class="text-sm font-medium" aria-live="polite">
          @if (isLoading()) {
            <span class="text-content-secondary animate-pulse">Carregando...</span>
          } @else {
            @switch (connectionState()) {
              @case ('connected') {
                <span class="text-success flex items-center gap-2">
                  <span class="relative flex h-2.5 w-2.5">
                    <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-success opacity-75"></span>
                    <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-success"></span>
                  </span>
                  Ao vivo
                </span>
              }
              @case ('reconnecting') {
                <span class="text-warning flex items-center gap-2">
                  <svg class="animate-spin -ml-1 mr-2 h-4 w-4 text-warning" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                  </svg>
                  Reconectando...
                </span>
              }
              @case ('disconnected') {
                <span class="text-error flex items-center gap-2">
                  <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                     <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                  </svg>
                  Dados podem estar desatualizados
                  <button (click)="dashboardService.loadSnapshot(); dashboardService.connectSSE()" class="ml-2 underline text-primary hover:text-primary-dark">Atualizar</button>
                </span>
              }
            }
          }
        </div>
    </div>

    <!-- Quick Actions (Moved to TOP) -->
    <app-quick-actions
        (action)="navigateTo($event === 'pos' ? '/pos' : $event === 'products' ? '/products/new' : $event === 'inventory' ? '/inventory' : '/sales')">
    </app-quick-actions>

    <!-- KPI Cards -->
    <app-kpi-cards [revenueToday]="revenueToday()" [salesToday]="salesToday()" [totalProducts]="totalProducts()"
        [lowStock]="lowStock()" [outOfStock]="outOfStock()">
    </app-kpi-cards>

    <!-- Revenue Chart -->
    <app-revenue-chart [chartOptions]="chartOptions()">
    </app-revenue-chart>

    <!-- Main Content Grid -->
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-6">
        <!-- Recent Sales -->
        <app-recent-sales [recentSales]="recentSales()" (viewAll)="navigateTo('/sales')">
        </app-recent-sales>

        <!-- Recent Inventory Movements -->
        <app-inventory-movements [recentMovements]="recentMovements()" (viewAll)="navigateTo('/inventory')">
        </app-inventory-movements>
    </div>

</div>
