<form (ngSubmit)="onSubmit()" #form="ngForm" class="space-y-4">
  <div>
    <label class="block text-sm font-medium text-slate-300 mb-1">Type</label>
    <select name="type" [(ngModel)]="dto.type" class="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-md text-slate-200">
      <option value="PAYABLE">Payable</option>
      <option value="RECEIVABLE">Receivable</option>
    </select>
  </div>

  <div>
    <label class="block text-sm font-medium text-slate-300 mb-1">Description</label>
    <input type="text" name="description" [(ngModel)]="dto.description" required class="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-md text-slate-200">
  </div>

  <div>
    <label class="block text-sm font-medium text-slate-300 mb-1">Amount</label>
    <input type="number" name="amount" [(ngModel)]="dto.amount" required min="0.01" step="0.01" class="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-md text-slate-200">
  </div>

  <div>
    <label class="block text-sm font-medium text-slate-300 mb-1">Due Date</label>
    <input type="date" name="dueDate" [(ngModel)]="dto.dueDate" required class="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-md text-slate-200">
  </div>

  <div class="flex justify-end gap-3 mt-6">
    <ui-button type="button" variant="ghost" (click)="cancel()">Cancel</ui-button>
    <ui-button type="submit" variant="primary" [loading]="isSubmitting" [disabled]="form.invalid === true">Save Account</ui-button>
  </div>
</form>
