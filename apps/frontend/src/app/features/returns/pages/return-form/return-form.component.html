<div class="container mx-auto p-6 max-w-4xl">
  <ui-page-header title="Iniciar Devolução" subtitle="Siga os passos abaixo para registrar uma solicitação de devolução ou troca.">
    <ng-template #actions>
      <ui-button routerLink="/sales" variant="secondary" size="md">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
        </svg>
        Voltar para Vendas
      </ui-button>
    </ng-template>
  </ui-page-header>

  <!-- Content Card -->
  <ui-card class="min-h-[500px] flex flex-col" padding="none">
    <div class="p-6 flex-1 flex flex-col">
      <div *ngIf="loading()" class="flex-1 flex items-center justify-center">
        <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-primary"></div>
      </div>

      <div *ngIf="!loading() && error()"
        class="bg-red-50 border border-red-200 text-red-700 p-4 rounded-lg flex items-center gap-3">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
        </svg>
        {{ error() }}
      </div>

      <div *ngIf="!loading() && !error() && store.selectedSale() as sale" class="flex-1 flex flex-col">

        <!-- NEW Stepper with encapsulated content -->
        <ui-stepper [currentStep]="currentStep()">

          <ui-step label="Itens">
            <h2 class="text-xl font-semibold mb-6">Selecione os itens para devolução</h2>
            <app-return-item-selector [sale]="sale"></app-return-item-selector>
          </ui-step>

          <ui-step label="Motivo">
            <h2 class="text-xl font-semibold mb-6">Motivo e Tipo de Reembolso</h2>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
              <button type="button" (click)="setRefundType('STORE_CREDIT')"
                class="card-hover text-left flex flex-col gap-2 relative overflow-hidden transition-all duration-300"
                [ngClass]="{'border-primary bg-primary/5 shadow-md': store.wizardState().refundType === 'STORE_CREDIT'}">
                <svg class="w-6 h-6 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M3 10h18M7 15h1m4 0h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z">
                  </path>
                </svg>
                <span class="font-bold">Crédito em Loja</span>
                <span class="text-xs text-content-secondary line-clamp-2">Valor disponível para futuras compras do
                  cliente.</span>
                <div *ngIf="store.wizardState().refundType === 'STORE_CREDIT'"
                  class="absolute -top-1 -right-1 text-primary">
                  <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20">
                    <path fill-rule="evenodd"
                      d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z"
                      clip-rule="evenodd"></path>
                  </svg>
                </div>
              </button>

              <button type="button" (click)="setRefundType('CASH_REFUND')"
                class="card-hover text-left flex flex-col gap-2 relative overflow-hidden transition-all duration-300"
                [ngClass]="{'border-primary bg-primary/5 shadow-md': store.wizardState().refundType === 'CASH_REFUND'}">
                <svg class="w-6 h-6 text-success" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M17 9V7a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2m2 4h10a2 2 0 002-2v-6a2 2 0 00-2-2H9a2 2 0 00-2 2v6a2 2 0 002 2zm7-5a2 2 0 11-4 0 2 2 0 014 0z">
                  </path>
                </svg>
                <span class="font-bold">Reembolso em Dinheiro</span>
                <span class="text-xs text-content-secondary line-clamp-2">Estorno via PIX, Cartão ou Dinheiro conforme
                  pagamento.</span>
                <div *ngIf="store.wizardState().refundType === 'CASH_REFUND'"
                  class="absolute -top-1 -right-1 text-primary">
                  <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20">
                    <path fill-rule="evenodd"
                      d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z"
                      clip-rule="evenodd"></path>
                  </svg>
                </div>
              </button>

              <button type="button" (click)="setRefundType('EXCHANGE')"
                class="card-hover text-left flex flex-col gap-2 relative overflow-hidden transition-all duration-300"
                [ngClass]="{'border-primary bg-primary/5 shadow-md': store.wizardState().refundType === 'EXCHANGE'}">
                <svg class="w-6 h-6 text-warning" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15">
                  </path>
                </svg>
                <span class="font-bold">Troca de Produto</span>
                <span class="text-xs text-content-secondary line-clamp-2">Substituição por outro item de valor
                  equivalente.</span>
                <div *ngIf="store.wizardState().refundType === 'EXCHANGE'"
                  class="absolute -top-1 -right-1 text-primary">
                  <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20">
                    <path fill-rule="evenodd"
                      d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z"
                      clip-rule="evenodd"></path>
                  </svg>
                </div>
              </button>
            </div>

            <div class="space-y-2">
              <label class="label">Motivo (Opcional)</label>
              <textarea class="input-field h-32 resize-none" placeholder="Descreva brevemente o motivo da devolução..."
                [ngModel]="store.wizardState().reason" (ngModelChange)="store.setReason($event)"></textarea>
            </div>
          </ui-step>

          <ui-step label="Revisão">
            <h2 class="text-xl font-semibold mb-6">Revisar Solicitação</h2>
            <app-return-summary></app-return-summary>
          </ui-step>

        </ui-stepper>

      </div>

      <!-- Footer Actions -->
      <div class="mt-auto pt-8 flex items-center justify-between border-t border-outline">
        <ui-button *ngIf="currentStep() > 1" (clicked)="prevStep()" variant="secondary">
          Anterior
        </ui-button>
        <div *ngIf="currentStep() === 1"></div>

        <div class="flex items-center gap-4">
          <ui-button *ngIf="currentStep() < 3" (clicked)="nextStep()" [disabled]="store.selectedItems().length === 0"
            variant="primary">
            Próximo Passo
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path>
            </svg>
          </ui-button>
          @if (currentStep() === 3) {
          <ui-button (clicked)="onSubmit()" [loading]="loading()" variant="success">
            Confirmar Devolução
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
            </svg>
          </ui-button>
          }
        </div>
      </div>
    </div>
  </ui-card>
</div>
