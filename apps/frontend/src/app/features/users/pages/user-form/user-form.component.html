<div class="max-w-4xl mx-auto pb-12 px-4 py-8">
  <div class="flex items-center gap-4 mb-8">
    <h1 class="text-3xl font-bold text-content-primary tracking-tight">
      Novo <span class="text-primary">Funcionário</span>
    </h1>
  </div>

  <form [formGroup]="userForm" (ngSubmit)="onSubmit()">
    <div class="flex flex-col gap-8">
      
      @if (errorMessage()) {
        <ui-card padding="sm" class="bg-red-50 border-red-200">
          <div class="flex gap-3 text-red-700 items-start">
            <svg class="h-5 w-5 mt-0.5 shrink-0" viewBox="0 0 20 20" fill="currentColor">
              <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd" />
            </svg>
            <p class="text-sm font-medium">{{ errorMessage() }}</p>
          </div>
        </ui-card>
      }

      <ui-card [shadow]="true" padding="none" title="Informações Pessoais" subTitle="Dados básicos para a conta do funcionário">
        
        <div cardHeader class="p-2 bg-primary text-white rounded-lg shadow-sm">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" />
            <circle cx="12" cy="7" r="4" />
          </svg>
        </div>

        <div class="p-6 grid grid-cols-1 md:grid-cols-2 gap-x-8 gap-y-6">
          <ui-input-field 
            label="Nome Completo" 
            placeholder="Ex: João Silva" 
            formControlName="name"
            [required]="true"
            [error]="name?.touched && name?.invalid ? 'Nome é obrigatório' : ''"
          ></ui-input-field>

          <ui-input-field 
            label="E-mail" 
            type="email" 
            placeholder="Ex: joao@exemplo.com" 
            formControlName="email"
            [required]="true"
            [error]="email?.touched && email?.invalid ? 'E-mail válido é obrigatório' : ''"
          ></ui-input-field>

          <ui-input-field 
            label="Senha Temporária" 
            type="password" 
            placeholder="Mínimo 6 caracteres" 
            formControlName="password"
            [required]="true"
            [error]="password?.touched && password?.invalid ? 'Senha de 6 caracteres é obrigatória' : ''"
          ></ui-input-field>

          <div class="flex flex-col gap-2">
            <label class="text-sm font-medium text-content-secondary">Cargo / Papel</label>
            <select formControlName="role" class="w-full px-3 py-2 bg-surface border border-outline rounded-lg text-content focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-colors">
              <option value="USER">Funcionário (Vendedor)</option>
              <option value="ADMIN">Administrador</option>
            </select>
            <p class="text-xs text-content-tertiary">Administradores têm acesso total ao sistema.</p>
          </div>
        </div>
      </ui-card>

      <!-- Actions -->
      <div class="flex items-center justify-between pt-4">
        <p class="text-sm text-content-tertiary">* Campos obrigatórios</p>
        <div class="flex gap-4">
          <ui-button variant="ghost" type="button" (clicked)="cancel()" [disabled]="isLoading()">
            Cancelar
          </ui-button>
          <ui-button variant="primary" type="submit" [loading]="isLoading()" [disabled]="userForm.invalid">
            <div class="flex items-center gap-2">
              @if (!isLoading()) {
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z" />
                  <polyline points="17 21 17 13 7 13 7 21" />
                  <polyline points="7 3 7 8 15 8" />
                </svg>
              }
              Criar Funcionário
            </div>
          </ui-button>
        </div>
      </div>

    </div>
  </form>
</div>
