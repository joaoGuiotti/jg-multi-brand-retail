<div class="max-w-7xl mx-auto px-4 py-8">
  <div class="flex justify-between items-center mb-8">
    <div>
      <h1 class="text-3xl font-bold text-content-primary tracking-tight">Funcionários</h1>
      <p class="mt-2 text-content-tertiary">Gerencie as contas dos funcionários da sua loja.</p>
    </div>
    <ui-button variant="primary" icon="M12 4v16m8-8H4" [routerLink]="['/users/new']">
      Novo Funcionário
    </ui-button>
  </div>

  @if (errorMessage()) {
    <ui-card padding="sm" class="bg-red-50 border-red-200 mb-6">
      <div class="flex gap-3 text-red-700 items-start">
        <svg class="h-5 w-5 mt-0.5 shrink-0" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd" />
        </svg>
        <p class="text-sm font-medium">{{ errorMessage() }}</p>
      </div>
    </ui-card>
  }

  <div class="min-h-[400px]">
    <ui-table [columns]="columns()" [dataSource]="users()" [config]="tableConfig()">
      
      <div *uiTableColumn="'name'; let user">
        <span class="font-medium text-content-primary">{{ user.name }}</span>
      </div>

      <div *uiTableColumn="'role'; let user">
        <ui-badge [variant]="user.role === 'ADMIN' ? 'info' : 'default'">
          {{ getRoleLabel(user.role) }}
        </ui-badge>
      </div>

      <div *uiTableColumn="'status'; let user">
        <div class="flex items-center gap-2">
          <div class="w-2 h-2 rounded-full bg-success"></div>
          <span class="text-sm text-content-secondary">Ativo</span>
        </div>
      </div>

      <div *uiTableColumn="'actions'; let user">
        <div class="flex justify-end">
          <ui-button variant="ghost" size="sm" [disabled]="true" [uiTooltip]="'Em breve'">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
            </svg>
          </ui-button>
        </div>
      </div>

    </ui-table>
  </div>
</div>
