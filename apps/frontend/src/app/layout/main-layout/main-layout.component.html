<div class="flex h-screen">
  <!-- Sidebar -->
  <app-sidebar [isOpen]="isSidebarOpen" [isCollapsed]="isSidebarCollapsed" (toggleSidebar)="toggleSidebar()" (toggleCollapse)="toggleSidebarCollapse()"></app-sidebar>

  <!-- Main Content Area -->
  <div class="flex-1 flex flex-col overflow-hidden">
    <!-- Header -->
    <app-header (toggleSidebar)="toggleSidebar()" (toggleCollapse)="toggleSidebarCollapse()"></app-header>

    <!-- Page Content -->
    <main class="flex-1 overflow-x-hidden overflow-y-auto p-6">
      <router-outlet></router-outlet>
    </main>
  </div>
  <ui-toast-container></ui-toast-container>
</div>
