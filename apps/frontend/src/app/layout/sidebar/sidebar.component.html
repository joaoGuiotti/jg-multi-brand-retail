<aside [class.translate-x-0]="isOpen" [class.-translate-x-full]="!isOpen"
  class="fixed h-screen lg:static inset-y-0 left-0 z-50 w-64 bg-surface border-r border-outline transform transition-transform duration-300 ease-in-out lg:translate-x-0">
  <!-- Sidebar Header -->
  <div class="h-16 flex items-center justify-between px-6 border-b border-outline">
    <span class="text-lg font-semibold text-content">Menu</span>
    <button (click)="onToggle()" class="lg:hidden p-2 rounded-lg hover:bg-surface-hover" aria-label="Close sidebar">
      <svg class="w-5 h-5 text-content-secondary" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
      </svg>
    </button>
  </div>

  <!-- Navigation Menu -->
  <nav class="p-4 space-y-1">
    <a *ngFor="let item of menuItems" [routerLink]="item.route"
      routerLinkActive="bg-primary-light text-primary border-primary" [routerLinkActiveOptions]="{exact: false}"
      class="flex items-center gap-3 px-4 py-3 rounded-lg text-content-secondary hover:bg-surface-hover transition-colors border-l-4 border-transparent">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" [attr.d]="item.icon"></path>
      </svg>
      <span class="font-medium">{{ item.label }}</span>
    </a>
  </nav>
</aside>

<!-- Overlay for mobile -->
<div *ngIf="isOpen" (click)="onToggle()" class="fixed inset-0 bg-black bg-opacity-50 z-40 lg:hidden"></div>
