<div [class]="classes()">
    <!-- Card Header -->
    @if (title() || subTitle()) {
    <div class="px-6 py-4 bg-surface-tertiary border-b border-outline flex items-center justify-between font-medium">
        <div class="flex items-center gap-3">
            <ng-content select="[cardHeader]"></ng-content>
            <div>
                @if (title()) {
                <h2 class="text-lg font-bold text-content-primary">{{ title() }}</h2>
                }
                @if (subTitle()) {
                <p class="text-sm text-content-tertiary">{{ subTitle() }}</p>
                }
            </div>
        </div>
    </div>
    } @else {
    <ng-content select="[cardHeader]"></ng-content>
    }

    <!-- Card Content -->
    <div [class]="contentClasses()">
        <ng-content></ng-content>
    </div>
</div>
