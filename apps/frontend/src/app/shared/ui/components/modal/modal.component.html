<div class="ui-modal-backdrop" role="dialog" aria-modal="true"
    [attr.aria-labelledby]="options?.title ? 'ui-modal-title-' + modalId : null"
    [style.z-index]="options?.zIndex ?? 1000" (click)="onBackdropClick($event)">
    <div class="ui-modal-panel" [ngClass]="$safeNavigationMigration(options?.styleClass)" [ngStyle]="panelStyle"
        (click)="$event.stopPropagation()">
        <!-- Header (shown if title or closable) -->
        @if (options?.title || isClosable) {
        <div class="ui-modal-header">
            @if (options?.title) {
            <h2 class="ui-modal-title" [id]="'ui-modal-title-' + modalId">
                {{ options?.title }}
            </h2>
            }

            @if (isClosable) {
            <button type="button" class="ui-modal-close" aria-label="Fechar modal" (click)="close()">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"
                    aria-hidden="true">
                    <line x1="18" y1="6" x2="6" y2="18" />
                    <line x1="6" y1="6" x2="18" y2="18" />
                </svg>
            </button>
            }
        </div>
        }

        <!-- Dynamic content — receives MODAL_REF & MODAL_DATA via child injector -->
        <div class="ui-modal-body">
            <ng-container *ngComponentOutlet="contentComponent; injector: contentInjector" />
        </div>
    </div>
</div>
