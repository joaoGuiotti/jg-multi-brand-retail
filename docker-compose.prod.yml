x-db-env: &db-env
  DB_VENDOR: "postgresql"
  DB_HOST: "db"
  DB_PORT: ${DB_PORT:-5432}
  DB_NAME: ${DB_NAME:?DB_NAME é obrigatória}
  DB_USER: ${DB_USER:?DB_USER é obrigatória}
  DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD é obrigatória}
  DB_URL: "postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}?schema=public"
  DATABASE_URL: "postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}?schema=public"

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:?DB_NAME é obrigatória}
      POSTGRES_USER: ${DB_USER:?DB_USER é obrigatória}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD é obrigatória}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

  migrate:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
      target: migrate
    restart: "no"
    environment:
      <<: *db-env
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
    logging: *default-logging

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
      target: runtime
    restart: unless-stopped
    environment:
      <<: *db-env
      NODE_ENV: production
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET é obrigatória}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET é obrigatória}
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL é obrigatória}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      REFRESH_TOKEN_EXPIRES_IN: ${REFRESH_TOKEN_EXPIRES_IN:-7d}
      MAIL_HOST: ${MAIL_HOST:-localhost}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USER: ${MAIL_USER:-}
      MAIL_PASS: ${MAIL_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-Retail SaaS <no-reply@retailsaas.com>}
    depends_on:
      migrate:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - internal
    logging: *default-logging

  frontend:
    build:
      context: .
      dockerfile: ./apps/frontend/Dockerfile
      target: runtime
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - internal
    logging: *default-logging

networks:
  internal:
    driver: bridge

volumes:
  postgres_prod_data:
