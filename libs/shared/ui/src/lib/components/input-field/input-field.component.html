<div class="flex flex-col gap-1">
    <!-- Label -->
    <label *ngIf="label()" [for]="id()" class="block text-sm font-medium text-content-secondary">
        {{ label() }}
        <span *ngIf="isRequired()" class="text-error ml-0.5" aria-hidden="true">*</span>
    </label>

    <!-- Input -->
    <input [id]="id()" [type]="type()" [placeholder]="placeholder()" [class]="inputClasses()" [disabled]="disabled()"
        [required]="isRequired()" [attr.aria-describedby]="error() ? id() + '-error' : hint() ? id() + '-hint' : null"
        [attr.aria-invalid]="error() ? 'true' : null" [value]="value()" (input)="handleInput($event)"
        (blur)="handleBlur()" />

    <!-- Error message -->
    <p *ngIf="error()" [id]="id + '-error'" class="text-xs text-error flex items-center gap-1" role="alert">
        <svg class="w-3.5 h-3.5 shrink-0" fill="currentColor" viewBox="0 0 20 20">
            <path fill-rule="evenodd"
                d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z"
                clip-rule="evenodd" />
        </svg>
        {{ error() }}
    </p>

    <!-- Hint message -->
    <p *ngIf="hint() && !error()" [id]="id + '-hint'" class="text-xs text-content-tertiary">
        {{ hint() }}
    </p>
</div>
